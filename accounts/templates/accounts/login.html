{% extends 'accounts/base_auth.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<h2 class="text-2xl font-bold text-white mb-6">Welcome Back 👋</h2>
<form method="post">
    {% csrf_token %}
    <div class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Username</label>
            <input type="text" name="username" class="w-full px-4 py-2 bg-gray-800/50 border border-gray-700 rounded-lg text-white focus:outline-none" required>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1">Password</label>
            <input type="password" name="password" class="w-full px-4 py-2 bg-gray-800/50 border border-gray-700 rounded-lg text-white focus:outline-none" required>
        </div>
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-yellow-600 rounded-lg font-semibold text-gray-900 hover:opacity-90 transition">
            Sign In
        </button>
    </div>
</form>
<div class="mt-6 text-center">
    <p class="text-gray-400 text-sm">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-yellow-400 hover:text-yellow-300">Sign up</a></p>
</div>
{% endblock %}
