{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="bg-gray-800 rounded-xl p-6 border border-gray-700">
        <h2 class="text-2xl font-bold text-white mb-4">Your Profile</h2>
        <p class="text-gray-400">Username: {{ user.username }}</p>
        <p class="text-gray-400">Full Name: {{ user.get_full_name }}</p>
        <p class="text-gray-400">Age: {{ profile.get_age }} years</p>
        <p class="text-gray-400">Life Phase: {{ profile.get_life_phase_display }}</p>
        <p class="text-gray-400">GOAT Score: {{ profile.overall_goat_score|floatformat:1 }}</p>
    </div>
</div>
{% endblock %}
