<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GOAT Life Monitor{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%); min-height: 100vh; }
        .auth-card { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .gold-text { background: linear-gradient(135deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input:focus { border-color: #ffd200 !important; box-shadow: 0 0 0 3px rgba(255,215,0,0.1) !important; }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold gold-text">🏛️ GOAT</h1>
                <p class="text-gray-400 mt-2">Life Monitor · Track Greatness</p>
            </div>
            <div class="auth-card rounded-2xl p-8">
                {% if messages %}
                    {% for message in messages %}
                        <div class="mb-4 p-3 rounded-lg {% if message.tags == 'success' %}bg-green-500/20 text-green-400 border border-green-500/30{% else %}bg-red-500/20 text-red-400 border border-red-500/30{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
